
<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================================
         BASIC DOCUMENT CONFIGURATION
    ========================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#ffffff" />

    <!-- =========================================================
         PERFORMANCE: PRECONNECT

         Establish early connections to important
         external resources.
    ========================================================== -->

    <link
      rel="preconnect"
      href="https://cdn.ultrastone.in"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://backend.ultrastones.com"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- =========================================================
         RESPONSIVE HOMEPAGE HERO POSTER

         Existing responsive image preloads preserved.

         NOTE:
         These preloads currently run on all routes.
         Route-specific preloading can be implemented
         separately to avoid unnecessary requests.
    ========================================================== -->

    <!-- MOBILE HERO POSTER -->

    <link
      rel="preload"
      as="image"
      href="https://cdn.ultrastone.in/cdn-cgi/image/width=480,quality=75,format=auto/frame0.png"
      imagesrcset="
        https://cdn.ultrastone.in/cdn-cgi/image/width=480,quality=75,format=auto/frame0.png 480w,
        https://cdn.ultrastone.in/cdn-cgi/image/width=768,quality=75,format=auto/frame0.png 768w,
        https://cdn.ultrastone.in/cdn-cgi/image/width=960,quality=75,format=auto/frame0.png 960w
      "
      imagesizes="100vw"
      media="(max-width: 767px)"
      fetchpriority="high"
    />

    <!-- DESKTOP HERO POSTER -->

    <link
      rel="preload"
      as="image"
      href="https://cdn.ultrastone.in/cdn-cgi/image/width=1600,quality=80,format=auto/frame0.png"
      imagesrcset="
        https://cdn.ultrastone.in/cdn-cgi/image/width=1280,quality=80,format=auto/frame0.png 1280w,
        https://cdn.ultrastone.in/cdn-cgi/image/width=1600,quality=80,format=auto/frame0.png 1600w,
        https://cdn.ultrastone.in/cdn-cgi/image/width=1920,quality=80,format=auto/frame0.png 1920w
      "
      imagesizes="100vw"
      media="(min-width: 768px)"
      fetchpriority="high"
    />

    <!-- =========================================================
         GOOGLE FONTS - CSP COMPATIBLE

         Removed:
         - Inline onload handler
         - Preload-to-stylesheet conversion
         - External font-loader.js dependency

         Fonts now load through a standard stylesheet.
         font-display=swap is retained in the URL.
    ========================================================== -->

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700&display=swap"
    />

    <!-- =========================================================
         GOOGLE TAG MANAGER - CSP COMPATIBLE

         Existing GTM container preserved.
         Bootstrap runs from public/gtm-loader.js.
    ========================================================== -->

    <script src="/gtm-loader.js" defer></script>

    <!-- =========================================================
         SEARCH ENGINE CRAWLING
    ========================================================== -->

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =========================================================
         PRIMARY SEO
    ========================================================== -->

    <title>
      Luxury Granite, Marble & Quartz Countertops | Ultra Stones
    </title>

    <meta
      name="description"
      content="Explore premium granite, marble, quartzite, quartz and engineered surfaces from Ultra Stones for residential and commercial projects."
    />

    <meta name="author" content="Ultra Stones" />

    <meta name="publisher" content="Ultra Stones" />

    <!-- =========================================================
         CANONICAL URL

         Your React SEO component updates this
         for individual routes.
    ========================================================== -->

    <link
      rel="canonical"
      href="https://www.ultrastones.com/"
    />

    <!-- =========================================================
         LANGUAGE / REGION
    ========================================================== -->

    <meta
      http-equiv="content-language"
      content="en"
    />

    <!-- =========================================================
         OPEN GRAPH / SOCIAL SHARING
    ========================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <meta
      property="og:site_name"
      content="Ultra Stones"
    />

    <meta
      property="og:title"
      content="Luxury Granite, Marble & Quartz Countertops | Ultra Stones"
    />

    <meta
      property="og:description"
      content="Explore premium granite, marble, quartzite, quartz and engineered surfaces from Ultra Stones for residential and commercial projects."
    />

    <meta
      property="og:url"
      content="https://www.ultrastones.com/"
    />

    <meta
      property="og:image"
      content="https://cdn.ultrastone.in/cdn-cgi/image/width=1920,quality=78,format=auto/frame0.png"
    />

    <meta
      property="og:image:alt"
      content="Luxury granite, marble and quartz surfaces by Ultra Stones"
    />

    <meta
      property="og:image:width"
      content="1920"
    />

    <meta
      property="og:image:height"
      content="1080"
    />

    <!-- =========================================================
         TWITTER / X
    ========================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Luxury Granite, Marble & Quartz Countertops | Ultra Stones"
    />

    <meta
      name="twitter:description"
      content="Explore premium granite, marble, quartzite, quartz and engineered surfaces from Ultra Stones."
    />

    <meta
      name="twitter:image"
      content="https://cdn.ultrastone.in/cdn-cgi/image/width=1920,quality=78,format=auto/frame0.png"
    />

    <meta
      name="twitter:image:alt"
      content="Luxury stone surfaces by Ultra Stones"
    />

    <!-- =========================================================
         FAVICON
    ========================================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <!-- =========================================================
         STRUCTURED DATA - ORGANIZATION

         JSON-LD is non-executable structured data.
    ========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ultra Stones",
        "url": "https://www.ultrastones.com/",
        "logo": "https://www.ultrastones.com/favicon.svg"
      }
    </script>

    <!-- =========================================================
         STRUCTURED DATA - WEBSITE
    ========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Ultra Stones",
        "url": "https://www.ultrastones.com/"
      }
    </script>

  </head>

  <body>
    <!-- =========================================================
         GOOGLE TAG MANAGER - NOSCRIPT

         No inline CSS or JavaScript.
    ========================================================== -->

    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-NR3PXVZX"
        height="0"
        width="0"
        hidden
      ></iframe>
    </noscript>

    <!-- =========================================================
         REACT ROOT
    ========================================================== -->

    <div id="root"></div>

    <!-- =========================================================
         VITE / REACT ENTRY POINT
    ========================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
