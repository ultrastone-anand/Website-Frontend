
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # NGINX SECURITY
    # ============================================

    # Hide nginx version from Server header.
    server_tokens off;

    # ============================================
    # HTTP SECURITY HEADERS
    # ============================================

    # Enforce HTTPS for this hostname.
    # No includeSubDomains or preload yet.
    add_header Strict-Transport-Security
        "max-age=31536000"
        always;

    # Prevent MIME-type sniffing.
    add_header X-Content-Type-Options
        "nosniff"
        always;

    # Prevent clickjacking through framing.
    add_header X-Frame-Options
        "DENY"
        always;

    # Limit referrer information.
    add_header Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    # Restrict browser features not used by
    # the normal website.
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;

    # ============================================
    # CONTENT SECURITY POLICY - REPORT ONLY
    # ============================================

    # Initial monitoring policy.
    # Review violations before enforcement.
    # This policy does not block resources yet.

    add_header Content-Security-Policy-Report-Only
        "default-src 'self' https: data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
        always;

    # ============================================
    # GZIP COMPRESSION
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ============================================
    # VITE ASSETS - LONG-TERM CACHE
    # ============================================

    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control
            "public, immutable";

        # Security headers must be repeated here
        # because location-level add_header
        # overrides server-level inheritance.

        add_header Strict-Transport-Security
            "max-age=31536000"
            always;

        add_header X-Content-Type-Options
            "nosniff"
            always;

        add_header X-Frame-Options
            "DENY"
            always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()"
            always;

        add_header Content-Security-Policy-Report-Only
            "default-src 'self' https: data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
            always;
    }

    # ============================================
    # HTML - ALWAYS CHECK FOR UPDATES
    # ============================================

    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control
            "no-cache, must-revalidate";

        add_header Strict-Transport-Security
            "max-age=31536000"
            always;

        add_header X-Content-Type-Options
            "nosniff"
            always;

        add_header X-Frame-Options
            "DENY"
            always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()"
            always;

        add_header Content-Security-Policy-Report-Only
            "default-src 'self' https: data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
            always;
    }

    # ============================================
    # REACT ROUTER - SPA FALLBACK
    # ============================================

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control
            "no-cache, must-revalidate";

        add_header Strict-Transport-Security
            "max-age=31536000"
            always;

        add_header X-Content-Type-Options
            "nosniff"
            always;

        add_header X-Frame-Options
            "DENY"
            always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()"
            always;

        add_header Content-Security-Policy-Report-Only
            "default-src 'self' https: data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
            always;
    }
}
