server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # GZIP COMPRESSION
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ============================================
    # VITE ASSETS - LONG-TERM CACHE
    # ============================================

    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # HTML - ALWAYS CHECK FOR UPDATES
    # ============================================

    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ============================================
    # REACT ROUTER - SPA FALLBACK
    # ============================================

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, must-revalidate";
    }
}