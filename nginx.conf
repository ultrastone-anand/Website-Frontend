
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # NGINX SECURITY
    # ============================================

    server_tokens off;

    # ============================================
    # CONTENT SECURITY POLICY - REPORT ONLY
    # ============================================

    # Test this stricter policy before enforcement.
    # Additional sources may be required by GTM
    # tags or other third-party integrations.

    set $site_csp "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://cdn.ultrastone.in https://www.googletagmanager.com https://www.google-analytics.com data: blob:; media-src 'self' https://cdn.ultrastone.in blob:; connect-src 'self' https://backend.ultrastones.com https://cdn.ultrastone.in https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';";

    # ============================================
    # HTTP SECURITY HEADERS
    # ============================================

    add_header Strict-Transport-Security
        "max-age=31536000"
        always;

    add_header X-Content-Type-Options
        "nosniff"
        always;

    add_header X-Frame-Options
        "DENY"
        always;

    add_header Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;

    add_header Content-Security-Policy-Report-Only
        "$site_csp"
        always;

    # ============================================
    # GZIP COMPRESSION
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ============================================
    # VITE ASSETS - LONG-TERM CACHE
    # ============================================

    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control
            "public, immutable";

        add_header Strict-Transport-Security
            "max-age=31536000"
            always;

        add_header X-Content-Type-Options
            "nosniff"
            always;

        add_header X-Frame-Options
            "DENY"
            always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()"
            always;

        add_header Content-Security-Policy-Report-Only
            "$site_csp"
            always;
    }

    # ============================================
    # HTML - ALWAYS CHECK FOR UPDATES
    # ============================================

    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control
            "no-cache, must-revalidate";

        add_header Strict-Transport-Security
            "max-age=31536000"
            always;

        add_header X-Content-Type-Options
            "nosniff"
            always;

        add_header X-Frame-Options
            "DENY"
            always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()"
            always;

        add_header Content-Security-Policy-Report-Only
            "$site_csp"
            always;
    }

    # ============================================
    # REACT ROUTER - SPA FALLBACK
    # ============================================

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control
            "no-cache, must-revalidate";

        add_header Strict-Transport-Security
            "max-age=31536000"
            always;

        add_header X-Content-Type-Options
            "nosniff"
            always;

        add_header X-Frame-Options
            "DENY"
            always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()"
            always;

        add_header Content-Security-Policy-Report-Only
            "$site_csp"
            always;
    }
}
